spring.application.name=doiboardbackend

server.servlet.context-path=/doiboard

# Database configuration
spring.datasource.url=${DB_URL:jdbc:mysql://idp.upc.edu:3306/doiboard?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:b1bl10}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server configuration
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:localhost}


# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY}
gemini.api.model=${GEMINI_API_MODEL:gemini-2.5-flash}
gemini.api.version=${GEMINI_API_VERSION:v1}
