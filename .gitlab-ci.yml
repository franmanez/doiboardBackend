stages:
  - build
  #- test
  - docker_build
  - deploy

# Cacheo de dependencias de Gradle para evitar descargas innecesarias
cache:
  paths:
    - .gradle/wrapper/
    - .gradle/caches/

# Job para compilar el proyecto y generar el JAR
build:
  stage: build
  image: gradle:jdk21
  tags:
    - UPC
  script:
    - ./gradlew clean build
  artifacts:
    paths:
      - build/libs/*.jar  # Guarda el JAR generado como artefacto
  only:
    - main  # Solo corre el job en la rama "main"

# Job para ejecutar las pruebas
  #test:
  #  stage: test
  #  image: gradle:jdk17
    #  tags:
  #    - UPC
    #  script:
  #    - ./gradlew test
    #  only:
#    - main

# Job para construir la imagen Docker con Docker Compose y publicarla en Artifactory
docker_build:
  stage: docker_build
  tags:
    - UPC
  image: docker:latest  # Usa la imagen Docker oficial
  services:
    - docker:dind  # Docker en Docker para poder ejecutar Docker Compose
  script:
    # Inicia sesión en Artifactory (requiere variables de entorno con usuario y password/token)
    #- echo $CI_JOB_TOKEN | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    #- docker login upc-docker.artifactory.upcnet.es -u $ARTIFACTORY_USER -p $ARTIFACTORY_PASSWORD

    # Inicia sesión en Artifactory con la API Key (usando la variable ARTIFACTORY_API_KEY)
    # - echo $ARTIFACTORY_API_KEY | docker login upc-docker.artifactory.upcnet.es -u $ARTIFACTORY_USER --password-stdin

    # Inicia sesión en Harbor registry.upc.edu con el CLI SECRET (usando la variable REGISTRY_HARBOR_CLI_SECRET)
    - echo $REGISTRY_HARBOR_CLI_SECRET
    - echo $REGISTRY_HARBOR_CLI_SECRET | docker login registry.upc.edu/sddstic-sbpa -u francisco.manez --password-stdin
    # Usa Docker Compose para construir la imagen
    - docker-compose build doiboard
    # Empuja la imagen al repositorio Artifactory (automáticamente usa la etiqueta del docker-compose.yml)
    - docker-compose push doiboard
  only:
    - main

# Job para desplegar la aplicación en el servidor remoto
deploy:
  stage: deploy
  tags:
    - UPC
  image: alpine:latest  # Imagen ligera de Alpine para ejecutar comandos SSH
  script:
    - apk add --no-cache curl
    - curl ifconfig.me
    - apk add --no-cache openssh-client  # Instalar cliente SSH en la imagen Alpine
    - echo "== Verificando conectividad con ping =="
    - ping -c 4 idp.upc.edu  # Verificar si el servidor responde
    - echo "== Mostrar IP pública del runner =="
    - curl ifconfig.me  # Obtener la IP pública del runner para verificar si está permitida
    - echo "== Configurando SSH =="
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo "== Intentando ssh-keyscan =="
    - ssh-keyscan idp.upc.edu || echo "ssh-keyscan failed"  # Intentar ssh-keyscan y manejar errores
    - echo "== Verificar contenido de ~/.ssh/id_rsa =="
    - cat ~/.ssh/id_rsa  # Verificar que la clave privada se haya configurado correctamente
    - echo "== Probar conexión SSH manualmente =="
    - ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "echo 'Conexión SSH exitosa'" || echo "Conexión SSH fallida"
    - ssh-keyscan $SSH_HOST >> ~/.ssh/known_hosts  # Añadir el servidor a "known_hosts"
    - ssh $SSH_USER@$SSH_HOST "export GEMINI_API_KEY='$GEMINI_API_KEY'; cd /SAN/docker-deploy/doiboard/backend && docker compose down && docker compose pull && docker compose build --no-cache && docker compose up -d"
  only:
    - main
